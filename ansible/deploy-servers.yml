- hosts: backgroundserver
  become: true
  vars_files:
    - "vars/common.yml"
    - "vars/environment-specific/{{ deployment_environment_id }}.yml"
    - "{{ secrets_file_path }}"
  roles:
    - os-base
    - java
    - postgres-install
    - postgres-data
    - solr
    - redis
    - nodejs
    - role: postfix
      when: deployment_environment_id == "vagrant"
    - ckan-cron
    - supervisor
    - mysql
    - solr-reindex

- hosts: webserver
  become: true
  vars_files:
    - "vars/common.yml"
    - "vars/environment-specific/{{ deployment_environment_id }}.yml"
    - "{{ secrets_file_path }}"
  roles:
    - os-base
    - nodejs
    - role: postfix
      when: deployment_environment_id == "vagrant"
    - supervisor
    - nginx
    - mysql
    - php-fpm
    - wordpress
    - phppgadmin
